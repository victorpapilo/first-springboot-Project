spring.application.name=peak-hospital-backend

# MongoDB connection - update if you're using MongoDB Atlas instead of local
spring.data.mongodb.uri=mongodb://localhost:27017/peakhospital

server.port=8080

# Nicely formatted error responses
server.error.include-message=always

# JWT settings - CHANGE app.jwt.secret before any real deployment
app.jwt.secret=peakHospitalSuperSecretSigningKeyChangeThisInProduction123456
app.jwt.expiration-ms=86400000
